name: Security API tests
on:
  push:
    branches:
      - security/api-hardening-2026-10
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt httpx pytest
      - run: pytest -q backend/tests/test_security.py backend/tests/test_api_integration.py

  staging-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Verify external staging endpoint
        env:
          URL: https://soundcovery-api-security-test-staging.up.railway.app
        run: |
          python - <<'PY'
          import os, json, time, urllib.request, urllib.error
          base = os.environ["URL"]
          def call(path, data=None, origin=None):
              headers = {"Content-Type": "application/json"}
              if origin:
                  headers["Origin"] = origin
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(base + path, data=body, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.headers, json.loads(r.read())
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.headers, json.loads(exc.read())
          # Wait for the independent Railway build; no production traffic.
          for i in range(30):
              try:
                  status, _, health = call("/health")
                  if status == 200 and health.get("saem_db", {}).get("connected"):
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise RuntimeError("Staging backend did not become ready")
          code, headers, out = call("/festivals", origin="https://soundcovery.com")
          assert code == 200 and out.get("festivals"), (code, out)
          assert headers.get("Access-Control-Allow-Origin") == "https://soundcovery.com"
          code, headers, _ = call("/festivals", origin="https://untrusted.example")
          assert code == 200 and not headers.get("Access-Control-Allow-Origin")
          code, _, out = call("/recommend", {"band": "Radiohead", "time_filter": "all"})
          assert code == 200 and "recommendations" in out, (code, out)
          code, _, _ = call("/recommend", {"band": "x" * 301})
          assert code == 422
          code, _, out = call("/track", {"event_type": "staging_security_smoke"})
          assert code == 200 and out == {"ok": False, "error": "Tracking temporarily unavailable"}, out
          responses = [call("/health")[0] for _ in range(12)]
          assert 429 in responses, responses
          print("STAGING LIVE SMOKE PASSED")
          PY
