name: Security API tests
on:
  push:
    branches:
      - security/api-hardening-2026-10
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fastapi starlette httpx pytest
      - run: pytest -q backend/tests/test_security.py
